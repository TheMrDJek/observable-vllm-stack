name: ai-vllm-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-3}

x-vllm-common: &vllm-common
  image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.27.1}
  ipc: host
  volumes:
    - ./data/huggingface:/root/.cache/huggingface
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
    HF_HUB_DISABLE_TELEMETRY: "1"
    VLLM_MEDIA_URL_ALLOW_REDIRECTS: "0"
    # Передаётся переменной окружения, а не аргументом --api-key. Аргументы
    # командной строки попадают в /proc/<pid>/cmdline, который на хосте читает
    # любой локальный пользователь: он смог бы взять внутренний ключ vLLM и
    # обойти LiteLLM. /proc/<pid>/environ доступен только владельцу и root.
    VLLM_API_KEY: ${VLLM_API_KEY}
  networks:
    - backend
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  healthcheck:
    test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
    interval: 15s
    timeout: 5s
    retries: 40
    start_period: 15m
  logging: *default-logging
  restart: unless-stopped

services:
  # Команда задана строкой, а не списком: только в строковой форме Compose
  # разбивает значение на слова, поэтому пустой *_EXTRA_ARGS не добавляет ни
  # одного аргумента. В форме списка пустая переменная превратилась бы в пустой
  # аргумент, а отключить флаг вроде --reasoning-parser было бы нельзя вовсе:
  # запись ${VAR:-default} подставляет default и при пустом значении тоже.
  # Поэтому здесь используется ${VAR-default} без двоеточия: дефолт берётся
  # только когда переменная не определена, а пустое значение означает
  # "никаких дополнительных флагов".
  # Флаги, специфичные для семейства модели, держите в *_EXTRA_ARGS.
  vllm-main:
    <<: *vllm-common
    profiles: [main]
    command: >-
      ${MAIN_MODEL_ID:-QuantTrio/Qwen3.5-4B-AWQ}
      --revision ${MAIN_MODEL_REVISION:-32c292e3a73afe1138518180b1b6d2868c980ee2}
      --served-model-name ${MAIN_SERVED_MODEL_NAME:-qwen3.5-4b-awq}
      --max-model-len ${MAIN_VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${MAIN_VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      --cpu-offload-gb ${MAIN_CPU_OFFLOAD_GB:-0}
      --allowed-media-domains ${VLLM_ALLOWED_MEDIA_DOMAINS:-media.invalid}
      ${MAIN_EXTRA_ARGS---enforce-eager --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --limit-mm-per-prompt.image 2}
    ports:
      - "127.0.0.1:${MAIN_VLLM_PORT:-8001}:8000"

  # Слот определён, но не запущен: профиль без активации не создаёт контейнер и
  # не занимает VRAM. Поэтому второй слот ничего не стоит, пока не понадобится,
  # а все значения берутся из инлайновых дефолтов — блок ALT_* в .env
  # заводить не обязательно. Запуск: 'model.sh start alt' (остановит main).
  vllm-alt:
    <<: *vllm-common
    profiles: [alt]
    command: >-
      ${ALT_MODEL_ID:-Qwen/Qwen3-4B-AWQ}
      --revision ${ALT_MODEL_REVISION:-74d4bd2bd4bff9cafc9345221320bffb08b406a3}
      --served-model-name ${ALT_SERVED_MODEL_NAME:-qwen3-4b-awq}
      --max-model-len ${ALT_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${ALT_VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      --allowed-media-domains ${VLLM_ALLOWED_MEDIA_DOMAINS:-media.invalid}
      ${ALT_EXTRA_ARGS---reasoning-parser qwen3}
    ports:
      - "127.0.0.1:${ALT_VLLM_PORT:-8002}:8000"

  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-v1.96.2}
    command: [--config, /app/config.yaml, --port, "4000", --num_workers, "1"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      # Отдельные учётные данные для админки. Без них LiteLLM пускает в /ui по
      # имени admin с master-ключом в качестве пароля — то есть ключ, которым
      # выпускаются и отзываются все остальные ключи, вводится в форму в
      # браузере и оседает в менеджерах паролей. При одном публичном имени
      # админка доступна из сети, поэтому пароль обязателен.
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-litellm}
      VLLM_API_KEY: ${VLLM_API_KEY:-local-vllm}
      OTEL_EXPORTER: otlp_grpc
      OTEL_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      STORE_PROMPTS_IN_SPEND_LOGS: ${STORE_PROMPTS_IN_SPEND_LOGS:-false}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    networks:
      - backend
      - edge
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *default-logging
    restart: unless-stopped

  # Образ nginx-unprivileged, а не обычный nginx: там master стартует под root и
  # для перехода воркеров в пользователя nginx требует CAP_SETUID и CAP_SETGID,
  # то есть cap_drop: ALL пришлось бы ослабить. Здесь весь процесс работает под
  # UID 101 сразу, и capabilities не нужны вовсе. Плата — ключ TLS обязан быть
  # читаемым для UID 101; это проверяет 'model.sh gateway' перед перезапуском.
  nginx:
    image: nginxinc/nginx-unprivileged:${NGINX_VERSION:-1.29-alpine}
    profiles: [gateway]
    user: "101:101"
    environment:
      # Публичное имя собирается из короткого имени стенда и зоны:
      # vlm + rpa.local = vlm.rpa.local. Метка зоны разводит развёртывания
      # разных заказчиков, чтобы они не занимали одинаковые записи в DNS.
      PUBLIC_HOST: ${PUBLIC_HOST:-vlm}
      DNS_ZONE: ${DNS_ZONE:-rpa.local}
      # Полное прежнее имя вместе с зоной: при переезде меняется и она.
      OLD_PUBLIC_HOST: ${OLD_PUBLIC_HOST:-}
      # Кто может обращаться к административным путям. 'all' оставлено по
      # умолчанию, иначе админка не открылась бы с другой машины. Сузьте до
      # своей подсети, как только адреса известны: за этими путями стоит
      # управление ключами, лимитами и бюджетами.
      ADMIN_ALLOW_CIDR: ${ADMIN_ALLOW_CIDR:-all}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-server.crt}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-server.key}
      TLS_INTERNAL_CERT_FILE: ${TLS_INTERNAL_CERT_FILE:-internal.crt}
      TLS_INTERNAL_KEY_FILE: ${TLS_INTERNAL_KEY_FILE:-internal.key}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-0}
      # Ограничивает envsubst перечисленными префиксами. Без фильтра entrypoint
      # подставил бы и переменные самого nginx — $host, $scheme,
      # $proxy_add_x_forwarded_for — пустыми строками, и шлюз потерял бы
      # заголовки проксирования, пройдя при этом nginx -t.
      NGINX_ENVSUBST_FILTER: '^(PUBLIC_|OLD_PUBLIC_|TLS_|NGINX_CLIENT_|DNS_ZONE|ADMIN_)'
    volumes:
      - ./nginx/templates/common.conf.template:/etc/nginx/templates/00-common.conf.template:ro
      - ${NGINX_CONFIG_FILE:-./nginx/templates/gateway.internal.conf.template}:/etc/nginx/templates/10-gateway.conf.template:ro
      # Каталог маршрутов монтируется вне /etc/nginx/conf.d: всё, что лежит там,
      # включается в http-блок автоматически, а эти файлы содержат директивы
      # уровня location и на верхнем уровне дали бы ошибку разбора.
      - ./nginx/routes:/etc/nginx/routes:ro
      - ${TLS_CERTS_DIR:-./secrets/tls}:/etc/nginx/certs:ro
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTPS_PORT:-443}:8443"
    networks:
      - edge
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    read_only: true
    # mode=1777, а не uid=101: опции uid/gid для tmpfs игнорируются частью
    # конфигураций Docker, и каталог достался бы root, после чего nginx под
    # UID 101 не смог бы ни отрендерить шаблоны, ни создать временные пути.
    tmpfs:
      # Здесь лежит nginx.pid: unprivileged-образ переносит его из /var/run.
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      # Сюда entrypoint рендерит шаблоны. Монтирование поверх заодно скрывает
      # штатный default.conf из образа, который слушал бы 8080.
      - /etc/nginx/conf.d:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.4.1}
    profiles: [local-observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.5.1}
    profiles: [local-observability]
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.8.1}
    profiles: [local-observability]
    command: [-config.file=/etc/tempo/config.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.17.1}
    # Вынесен в профиль, чтобы режим 'observability off' пережил последующий
    # 'start main': обычный 'up -d' поднимает все сервисы без профиля и вернул
    # бы намеренно остановленный Alloy. Команда observability передаёт
    # --profile telemetry явно.
    profiles: [telemetry]
    privileged: true
    environment:
      ALLOY_DEPLOY_MODE: docker
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-ai-vllm-stack}
      ENVIRONMENT: ${ENVIRONMENT:-pilot}
      SITE: ${SITE:-local}
      INSTANCE_ID: ${INSTANCE_ID:-vlm-host}
      REMOTE_METRICS_URL: ${REMOTE_METRICS_URL:-}
      REMOTE_METRICS_TOKEN: ${REMOTE_METRICS_TOKEN:-}
      REMOTE_LOKI_URL: ${REMOTE_LOKI_URL:-}
      REMOTE_LOKI_TOKEN: ${REMOTE_LOKI_TOKEN:-}
      REMOTE_TEMPO_ENDPOINT: ${REMOTE_TEMPO_ENDPOINT:-}
      REMOTE_TEMPO_TOKEN: ${REMOTE_TEMPO_TOKEN:-}
      REMOTE_CA_FILE: ${REMOTE_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ${ALLOY_CONFIG_FILE:-./observability/config.alloy}:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/rootproc:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /var/lib/docker:/var/lib/docker:ro
      - ${REMOTE_CA_DIR:-./secrets/remote-ca}:/etc/alloy/remote-ca:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    networks:
      - backend
    # В образе Alloy нет ни curl, ни wget, поэтому проверка использует
    # встроенный в bash /dev/tcp. Она подтверждает, что HTTP-сервер принимает
    # соединения; полная готовность — GET /-/ready на 127.0.0.1:12345 с хоста.
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/12345"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:${NVIDIA_EXPORTER_VERSION:-1.3.2}
    profiles: [gpu-metrics]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - backend
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.1}
    profiles: [local-observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks:
      - backend
    depends_on:
      - prometheus
      - loki
      - tempo
    logging: *default-logging
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: false

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
