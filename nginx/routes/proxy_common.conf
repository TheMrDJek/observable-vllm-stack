# Общие директивы проксирования. Включается внутрь location, поэтому здесь нет
# ни server, ни proxy_pass — только настройки, одинаковые для LiteLLM и Open WebUI.
# Прямой аналог блока transport/flush_interval из прежнего caddy/routes.caddy.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Open WebUI держит websocket-соединение. Caddy обновлял протокол сам, nginx
# требует эти два заголовка явно; $connection_upgrade объявлен в 00-common.conf.
# Без них UI молча теряет realtime-канал и деградирует до поллинга.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Аналог 'flush_interval -1' у Caddy. С включённой буферизацией nginx копит
# ответ целиком, и SSE-поток токенов доходит до клиента одним куском в конце
# генерации. Отключение request_buffering дополнительно избавляет от временных
# файлов в /var/cache/nginx на больших мультимодальных запросах.
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_max_temp_file_size 0;

# Заголовки ответа буферизуются даже при выключенном proxy_buffering: этот
# размер относится к первой части ответа со статусом и заголовками. Запас нужен,
# иначе upstream sent too big header завершит запрос ошибкой 502.
#
# Все три директивы задаются вместе не для красоты. nginx проверяет на старте,
# что proxy_busy_buffers_size меньше суммы proxy_buffers минус один буфер. При
# одном лишь proxy_buffer_size 16k busy становится 32k по умолчанию, а
# proxy_buffers остаётся дефолтным 8 4k = 32k, и конфигурация не проходит
# nginx -t. Здесь 32k < 128k - 16k, условие выполняется.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;

# Соответствует прежним таймаутам Caddy: dial 10s, остальное 10 минут.
# Длинная генерация на CPU-offload легко занимает минуты, поэтому 60s по
# умолчанию у nginx оборвал бы запрос на середине.
proxy_connect_timeout 10s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
send_timeout 600s;
