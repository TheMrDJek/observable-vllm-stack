# Пути инференса. Открыты всем, кто дотянулся до имени: доступ разграничивают
# virtual keys LiteLLM, а не сеть.
#
# '= /v1' и '^~ /v1/' вместо одного 'location /v1' — префиксный location матчит
# и /v1beta, и /v1-internal, то есть открыл бы пути, которых в правиле не было.
#
# Административные пути обслуживает 'location /' в шаблоне режима: там нужен
# ${ADMIN_ALLOW_CIDR}, а подстановка переменных работает только в шаблонах.

location = /v1 {
	include /etc/nginx/routes/to_litellm.conf;
}

location ^~ /v1/ {
	include /etc/nginx/routes/to_litellm.conf;
}
