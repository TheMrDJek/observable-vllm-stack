# API-хост пропускает только /v1 и /v1/*. Всё остальное, включая
# /key/generate и админку LiteLLM, получает 404: административные пути
# доступны исключительно по loopback на ${LITELLM_PORT}.
#
# '= /v1' и '^~ /v1/' вместо одного 'location /v1' — префиксный location
# матчит и /v1beta, и /v1-internal, то есть открыл бы наружу пути, которых
# в прежнем правиле Caddy 'path /v1 /v1/*' не было.

location = /v1 {
	include /etc/nginx/routes/to_litellm.conf;
}

location ^~ /v1/ {
	include /etc/nginx/routes/to_litellm.conf;
}

location / {
	return 404;
}
