# Адрес указан через переменную намеренно. При литеральном
# 'proxy_pass http://litellm:4000' nginx резолвит имя один раз на старте и
# кеширует IP навсегда: после пересоздания контейнера LiteLLM шлюз отвечал бы
# 502 до ручного reload. С переменной адрес резолвится на каждый запрос через
# resolver, объявленный в 00-common.conf. Caddy делал это сам.
set $upstream_litellm "litellm:4000";

include /etc/nginx/routes/proxy_common.conf;

# $request_uri передаёт путь и query как есть, без нормализации nginx.
proxy_pass http://$upstream_litellm$request_uri;
