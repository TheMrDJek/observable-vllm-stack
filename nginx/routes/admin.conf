# Административный интерфейс и API LiteLLM: /ui, /key/*, /user/*, /spend/*,
# /model/* и всё остальное, что не начинается с /v1.
#
# Это НЕ один путь /ui: админка представляет собой SPA, которая обращается к
# десяткам управляющих эндпоинтов. Открыть «только интерфейс» невозможно —
# открывается весь управляющий API, поэтому защита здесь сетевая, а не по путям.
#
# Файл включается внутрь 'location /' шаблона, где уже применён allow/deny.

include /etc/nginx/routes/to_litellm.conf;
